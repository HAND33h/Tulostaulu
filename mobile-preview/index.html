<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1726"><meta name="apple-mobile-web-app-capable" content="yes"><title>Bunny King · Preview</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#eff7ff;background:#0c1726}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;flex-direction:column}header{text-align:center;padding:24px 12px 12px;color:#f4c95f}header h1{margin:0;font-size:29px}header small{color:#9fb9cf}main{padding:18px;flex:1;max-width:620px;width:100%;margin:auto}h2{font-size:18px;color:#f4c95f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:#1b4268;color:#fff;border:1px solid #51708b;border-radius:18px;min-height:132px;padding:12px;font-size:17px;font-weight:700}.tile:active{background:#2679ae}.hint{font-size:13px;color:#a9bfd3}.panel{background:#14253a;border:1px solid #365773;border-radius:15px;padding:18px;margin-top:18px}nav{position:sticky;bottom:0;background:#14253a;padding:12px 6px calc(12px + env(safe-area-inset-bottom));display:flex;gap:5px}nav button{flex:1;border:0;border-radius:12px;background:#1e364f;color:#fff;padding:14px 4px;font-size:12px}select{background:#1e364f;color:white;border:1px solid #50728c;border-radius:8px;padding:8px}a{color:#9ad6ff}
</style></head><body><header><h1>👑 BUNNY KING</h1><small>Whiteout Survival · Mobile Preview</small></header><main><label><span id="langlabel">Kieli</span> <select id="lang"><option value="fi">Suomi</option><option value="en">English</option></select></label><h2 id="title">Omat pikavalinnat</h2><p class="hint" id="hint">Pidä painiketta pohjassa tai napsauta hiiren oikealla vaihtaaksesi toiminnon.</p><div class="grid" id="tiles"></div><div class="panel" id="panel">Valitse toiminto. Tämä on käyttöliittymän esikatselu, ei vielä pelidataan yhdistetty sovellus.</div></main><nav id="nav"></nav>
<script>
const features=['data','battle','reports','upgrades','forum','calculator','sources','settings'];
const labels={fi:{data:'📊 Pelaajat & ranking',battle:'⚔️ Taistelusimulaattori',reports:'📋 Taisteluraportit',upgrades:'🔧 Kehitys & laskurit',forum:'💬 Foorumi',calculator:'🧮 Laskurit',sources:'🌐 Tietolähteet',settings:'⚙️ Asetukset',home:'🏠 Koti',more:'••• Lisää'},en:{data:'📊 Players & ranking',battle:'⚔️ Battle simulator',reports:'📋 Battle reports',upgrades:'🔧 Upgrades & tools',forum:'💬 Forum',calculator:'🧮 Calculators',sources:'🌐 Data sources',settings:'⚙️ Settings',home:'🏠 Home',more:'••• More'}};
let lang=localStorage.bunnyLang||((navigator.language||'fi').startsWith('fi')?'fi':'en');const slots=JSON.parse(localStorage.bunnySlots||'["data","battle","upgrades","forum"]');document.querySelector('#lang').value=lang;
function openFeature(id){document.querySelector('#panel').textContent=(labels[lang][id]||id)+(lang==='fi'?' – esikatselutila. Pelidata ja kirjautuminen eivät ole käytössä.':' – preview mode. Game data and login are not connected.');}
function choose(i){const options=features.map((id,n)=>`${n+1}. ${labels[lang][id]}`).join('\n');const answer=prompt((lang==='fi'?'Valitse pikavalinta numerolla:\n':'Choose shortcut by number:\n')+options);const n=Number(answer);if(Number.isInteger(n)&&n>=1&&n<=features.length){slots[i]=features[n-1];localStorage.bunnySlots=JSON.stringify(slots);render();}}
function render(){document.documentElement.lang=lang;document.querySelector('#title').textContent=lang==='fi'?'Omat pikavalinnat':'My shortcuts';document.querySelector('#langlabel').textContent=lang==='fi'?'Kieli':'Language';document.querySelector('#hint').textContent=lang==='fi'?'Pidä painiketta pohjassa vaihtaaksesi toiminnon.':'Long-press a tile to customize it.';const grid=document.querySelector('#tiles');grid.replaceChildren();slots.forEach((id,i)=>{let b=document.createElement('button');b.className='tile';b.textContent=labels[lang][id];let timer,held=false;b.addEventListener('pointerdown',()=>{held=false;timer=setTimeout(()=>{held=true;choose(i)},650)});b.addEventListener('pointerup',()=>clearTimeout(timer));b.addEventListener('pointerleave',()=>clearTimeout(timer));b.addEventListener('contextmenu',e=>{e.preventDefault();choose(i)});b.addEventListener('click',()=>{if(!held)openFeature(id)});grid.append(b)});const nav=document.querySelector('#nav');nav.replaceChildren();[['home',null],['data','data'],['battle','battle'],['more','more']].forEach(([id,target])=>{const b=document.createElement('button');b.textContent=labels[lang][id];b.onclick=()=>{if(target==='more'){document.querySelector('#panel').replaceChildren();features.forEach(f=>{const item=document.createElement('button');item.className='tile';item.style.minHeight='60px';item.style.width='100%';item.textContent=labels[lang][f];item.onclick=()=>openFeature(f);document.querySelector('#panel').append(item)})}else if(target)openFeature(target);else document.querySelector('#panel').textContent=lang==='fi'?'Etusivu':'Home'};nav.append(b)})}
document.querySelector('#lang').onchange=e=>{lang=e.target.value;localStorage.bunnyLang=lang;render()};render();
</script></body></html>
