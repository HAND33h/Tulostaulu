name: Build Fresh Signed APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare sources and artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-xxxhdpi
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          def decode(src, dst):
              s = Path(src).read_text()
              s = re.sub(r'[^A-Za-z0-9+/=]', '', s)
              s += '=' * ((-len(s)) % 4)
              Path(dst).write_bytes(base64.b64decode(s, validate=False))
          decode('app/src/main/splash_image.b64', 'app/src/main/res/drawable/wos_splash.jpg')
          decode('app/src/main/bunny_icon.b64', 'app/src/main/res/drawable/wos_bunny.jpg')
          p = Path('app/src/main/java/com/hand33h/tulostaulu/MainActivity.java')
          s = p.read_text()
          s = s.replace("k.replace('_',' ').replace('.', ' › ')", "k.replace('_',' ').replace(\".\", \" › \")")
          p.write_text(s)
          PY
          cp app/src/main/res/drawable/wos_bunny.jpg app/src/main/res/mipmap-xxxhdpi/ic_launcher.jpg
          cp app/src/main/res/drawable/wos_bunny.jpg app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.jpg

      - name: Generate fresh signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore fresh-release.jks \
            -storepass WosInstall2026 \
            -keypass WosInstall2026 \
            -alias wosfresh \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=WOS Tulostaulu, OU=HAND33h, O=HAND33h, L=Vantaa, C=FI"

      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          "$ZIPALIGN" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk WOS-Tulostaulu-Fresh-aligned.apk
          "$APKSIGNER" sign \
            --ks fresh-release.jks \
            --ks-key-alias wosfresh \
            --ks-pass pass:WosInstall2026 \
            --key-pass pass:WosInstall2026 \
            --out WOS-Tulostaulu-Fresh-Signed.apk \
            WOS-Tulostaulu-Fresh-aligned.apk
          "$APKSIGNER" verify --verbose --print-certs WOS-Tulostaulu-Fresh-Signed.apk

      - name: Upload fresh signed APK
        uses: actions/upload-artifact@v4
        with:
          name: WOS-Tulostaulu-Fresh-Signed-APK
          path: WOS-Tulostaulu-Fresh-Signed.apk
          if-no-files-found: error
          retention-days: 7
