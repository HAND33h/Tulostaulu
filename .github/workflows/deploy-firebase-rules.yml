name: Deploy Firebase Rules

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - ".github/workflows/deploy-firebase-rules.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BUNNY_KING != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Write service account
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BUNNY_KING }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Validate Firebase project
        run: firebase projects:list --json >/dev/null

      - name: Deploy Firestore and Storage rules
        run: firebase deploy --project bunny-king --only firestore:rules,storage

      - name: Remove service account file
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
