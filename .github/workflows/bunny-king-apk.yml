name: Build Bunny King Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android-bunny/**'
      - 'bunny-king-sunfire-preview-20261008.html'
      - '.github/workflows/bunny-king-apk.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Bundle current Bunny King HTML
        run: |
          mkdir -p android-bunny/app/src/main/assets
          cp bunny-king-sunfire-preview-20261008.html android-bunny/app/src/main/assets/index.html
      - name: Build debug APK
        working-directory: android-bunny
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Bunny-King-OnePlus13-APK
          path: android-bunny/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
