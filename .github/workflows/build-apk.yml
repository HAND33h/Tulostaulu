name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare WOS artwork
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-xxxhdpi
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          def decode(src, dst):
              s = Path(src).read_text()
              s = re.sub(r'[^A-Za-z0-9+/=]', '', s)
              s += '=' * ((-len(s)) % 4)
              Path(dst).write_bytes(base64.b64decode(s, validate=False))
          decode('app/src/main/splash_image.b64', 'app/src/main/res/drawable/wos_splash.jpg')
          decode('app/src/main/bunny_icon.b64', 'app/src/main/res/drawable/wos_bunny.jpg')
          PY
          cp app/src/main/res/drawable/wos_bunny.jpg app/src/main/res/mipmap-xxxhdpi/ic_launcher.jpg
          cp app/src/main/res/drawable/wos_bunny.jpg app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.jpg

          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/hand33h/tulostaulu/MainActivity.java')
          s = p.read_text()
          s = s.replace("replace('.', ' › ')", "replace(\".\", \" › \")")
          p.write_text(s)
          PY

          cat > app/src/main/java/com/hand33h/tulostaulu/SplashActivity.java <<'JAVA'
          package com.hand33h.tulostaulu;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.widget.ImageView;

          public class SplashActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestWindowFeature(Window.FEATURE_NO_TITLE);
                  getWindow().setStatusBarColor(Color.BLACK);
                  getWindow().setNavigationBarColor(Color.BLACK);
                  getWindow().setFlags(WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS);
                  ImageView image = new ImageView(this);
                  image.setImageResource(com.hand33h.tulostaulu.R.drawable.wos_splash);
                  image.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  image.setBackgroundColor(Color.BLACK);
                  image.setSystemUiVisibility(View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION);
                  setContentView(image);
                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      startActivity(new Intent(SplashActivity.this, UnifiedActivity.class));
                      finish();
                  }, 1900);
              }
          }
          JAVA

          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/AndroidManifest.xml')
          s = path.read_text()
          if '.SplashActivity' not in s:
              old = '''        <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>'''
              new = '''        <activity
                      android:name=".MainActivity"
                      android:exported="false" />
                  <activity
                      android:name=".SplashActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>'''
              if old not in s:
                  raise SystemExit('Expected MainActivity manifest block not found')
              path.write_text(s.replace(old, new))
          PY

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: WOS-Tulostaulu-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Restore release keystore
        if: ${{ env.KEYSTORE_B64 != '' }}
        shell: bash
        run: echo "$KEYSTORE_B64" | base64 --decode > release.jks

      - name: Build unsigned release APK
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: gradle assembleRelease

      - name: Sign release APK
        if: ${{ env.KEYSTORE_B64 != '' }}
        shell: bash
        run: |
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          "$ZIPALIGN" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk WOS-Tulostaulu-aligned.apk
          "$APKSIGNER" sign --ks release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out WOS-Tulostaulu.apk WOS-Tulostaulu-aligned.apk
          "$APKSIGNER" verify --verbose --print-certs WOS-Tulostaulu.apk

      - name: Upload signed APK
        if: ${{ env.KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: WOS-Tulostaulu-APK
          path: WOS-Tulostaulu.apk
          if-no-files-found: error
