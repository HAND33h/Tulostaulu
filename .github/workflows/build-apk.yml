name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare WOS artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-xxxhdpi
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          def decode(src, dst):
              s = Path(src).read_text()
              s = re.sub(r'[^A-Za-z0-9+/=]', '', s)
              s += '=' * ((-len(s)) % 4)
              Path(dst).write_bytes(base64.b64decode(s, validate=False))
          decode('app/src/main/splash_image.b64', 'app/src/main/res/drawable/wos_splash.jpg')
          decode('app/src/main/bunny_icon.b64', 'app/src/main/res/drawable/wos_bunny.jpg')
          PY
          cp app/src/main/res/drawable/wos_bunny.jpg app/src/main/res/mipmap-xxxhdpi/ic_launcher.jpg
          cp app/src/main/res/drawable/wos_bunny.jpg app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.jpg
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/hand33h/tulostaulu/MainActivity.java')
          s = p.read_text()
          s = s.replace("replace('.', ' › ')", "replace(\".\", \" › \")")
          p.write_text(s)
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: WOS-Tulostaulu-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Restore release keystore
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > release.jks

      - name: Build unsigned release APK
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        run: gradle --no-daemon assembleRelease

      - name: Sign release APK
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          "$ZIPALIGN" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk WOS-Tulostaulu-aligned.apk
          "$APKSIGNER" sign --ks release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out WOS-Tulostaulu.apk WOS-Tulostaulu-aligned.apk
          "$APKSIGNER" verify --verbose --print-certs WOS-Tulostaulu.apk

      - name: Upload signed APK
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: WOS-Tulostaulu-APK
          path: WOS-Tulostaulu.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing material
        if: ${{ always() && env.HAS_SIGNING_KEY == 'true' }}
        shell: bash
        run: rm -f release.jks WOS-Tulostaulu-aligned.apk
