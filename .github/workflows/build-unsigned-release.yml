name: Build unsigned release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare artwork and splash
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-xxxhdpi
          python3 - <<'PY'
          from pathlib import Path
          import base64,re
          def d(src,dst):
              s=re.sub(r'[^A-Za-z0-9+/=]','',Path(src).read_text()); s+='='*((-len(s))%4); Path(dst).write_bytes(base64.b64decode(s,validate=False))
          d('app/src/main/splash_image.b64','app/src/main/res/drawable/wos_splash.jpg')
          d('app/src/main/bunny_icon.b64','app/src/main/res/drawable/wos_bunny.jpg')
          PY
          cp app/src/main/res/drawable/wos_bunny.jpg app/src/main/res/mipmap-xxxhdpi/ic_launcher.jpg
          cp app/src/main/res/drawable/wos_bunny.jpg app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.jpg
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/hand33h/tulostaulu/MainActivity.java'); s=p.read_text().replace("replace('.', ' › ')","replace(\".\", \" › \")"); p.write_text(s)
          PY
          cat > app/src/main/java/com/hand33h/tulostaulu/SplashActivity.java <<'JAVA'
          package com.hand33h.tulostaulu;
          import android.app.Activity;import android.content.Intent;import android.graphics.Color;import android.os.Bundle;import android.os.Handler;import android.os.Looper;import android.view.View;import android.view.Window;import android.view.WindowManager;import android.widget.ImageView;
          public class SplashActivity extends Activity {protected void onCreate(Bundle b){super.onCreate(b);requestWindowFeature(Window.FEATURE_NO_TITLE);getWindow().setStatusBarColor(Color.BLACK);getWindow().setNavigationBarColor(Color.BLACK);getWindow().setFlags(WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS);ImageView i=new ImageView(this);i.setImageResource(R.drawable.wos_splash);i.setScaleType(ImageView.ScaleType.CENTER_CROP);setContentView(i);new Handler(Looper.getMainLooper()).postDelayed(()->{startActivity(new Intent(this,UnifiedActivity.class));finish();},1900);}}
          JAVA
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/AndroidManifest.xml');s=p.read_text();old='''        <activity\n            android:name=".MainActivity"\n            android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>''';new='''        <activity android:name=".MainActivity" android:exported="false" />\n        <activity android:name=".SplashActivity" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>''';p.write_text(s.replace(old,new))
          PY
      - name: Build release
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: WOS-Tulostaulu-Unsigned-Release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
