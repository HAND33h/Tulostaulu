name: Build unsigned release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-xxxhdpi
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          def d(src, dst):
              s = re.sub(r'[^A-Za-z0-9+/=]', '', Path(src).read_text())
              s += '=' * ((-len(s)) % 4)
              Path(dst).write_bytes(base64.b64decode(s, validate=False))
          d('app/src/main/splash_image.b64', 'app/src/main/res/drawable/wos_splash.jpg')
          d('app/src/main/bunny_icon.b64', 'app/src/main/res/drawable/wos_bunny.jpg')
          PY
          cp app/src/main/res/drawable/wos_bunny.jpg app/src/main/res/mipmap-xxxhdpi/ic_launcher.jpg
          cp app/src/main/res/drawable/wos_bunny.jpg app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.jpg
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/hand33h/tulostaulu/MainActivity.java')
          s = p.read_text().replace("replace('.', ' › ')", "replace(\".\", \" › \")")
          p.write_text(s)
          PY

      - name: Build release
        run: gradle --no-daemon assembleRelease

      - name: Upload unsigned release
        uses: actions/upload-artifact@v4
        with:
          name: WOS-Tulostaulu-Unsigned-Release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
